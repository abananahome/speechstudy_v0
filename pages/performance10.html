    id="speechVideo"

	<script src="https://player.vimeo.com/api/player.js"></script>
	<script>

const iframe = document.getElementById("speechVideo");

const player = new Vimeo.Player(iframe);


// Starting timestamp

const startTime = 8 * 60 * 60 + 58 * 60 + 12;


// Ending timestamp

const endTime = 9 * 60 * 60 + 11 * 60;


// Move video to correct starting point

player.setCurrentTime(startTime);


// Monitor playback time

player.on("timeupdate", function(data) {

    if (data.seconds >= endTime) {

        player.pause();

    }

});

</script>
