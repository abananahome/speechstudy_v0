    <br><br>


    <label for="rank2">
        2nd Place
    </label>

    <select id="rank2" required>

        <option value="">Select a performance</option>

        <option value="POI_01">Performance 1</option>
        <option value="POI_02">Performance 2</option>
        <option value="POI_03">Performance 3</option>
        <option value="POI_04">Performance 4</option>
        <option value="POI_05">Performance 5</option>

    </select>

    <!-- Repeat for rank3, rank4, rank5 -->
	<br><br>


    <label for="rank3">
        3rd Place
    </label>

    <select id="rank3" required>

        <option value="">Select a performance</option>

        <option value="POI_01">Performance 1</option>
        <option value="POI_02">Performance 2</option>
        <option value="POI_03">Performance 3</option>

    <select id="rank4" required>

        <option value="">Select a performance</option>

        <option value="POI_01">Performance 1</option>
        <option value="POI_02">Performance 2</option>
        <option value="POI_03">Performance 3</option>

        5th Place
    </label>

    <select id="rank5" required>

        <option value="">Select a performance</option>

        <option value="POI_01">Performance 1</option>
        <option value="POI_02">Performance 2</option>
        <option value="POI_03">Performance 3</option>
        <option value="POI_04">Performance 4</option>
        <option value="POI_05">Performance 5</option>

    </button>

</form>


    </main>
	    </main>


        </main>


    <script src="../app.js"></script>

<script>

document
    .getElementById("rankingForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        // Collect rankings

        const rankings = [

            document.getElementById("rank1").value,
            document.getElementById("rank2").value,
            document.getElementById("rank3").value,
            document.getElementById("rank4").value,
            document.getElementById("rank5").value

        ];


        // Make sure every dropdown has an answer

        if (rankings.includes("")) {

            alert("Please rank all five performances.");

            return;

        }


        // Make sure no performance appears twice

        const uniqueRankings = new Set(rankings);

        if (uniqueRankings.size !== 5) {

            alert(
                "Each performance must receive a different rank."
            );

            return;

        }


        // Retrieve study data

        const studyData = JSON.parse(
            localStorage.getItem("studyData")
        );


        // Find POI session

        const poiSession = studyData.sessions.find(
            session => session.event === "POI"
        );


        // Safety check

        if (!poiSession) {

            alert("POI session not found.");

            return;

        }


        // IMPORTANT:
        // Clear evaluations first in case participant goes back
        // and submits rankings again.

        poiSession.evaluations = [];


        // Save ranking data

        rankings.forEach(function(speechID, index) {

            poiSession.evaluations.push({

                speech_id: speechID,

                rank: index + 1,

                explanation: ""

            });

        });


        // Save entire updated dataset

        localStorage.setItem(
            "studyData",
            JSON.stringify(studyData)
        );


        console.log(
            "POI rankings saved:",
            studyData
        );


        // Move forward

        window.location.href = "explanation.html";

    });

</script>

</body>

</body>
